[project]
name = "braintest-suite"
version = "0.1.0"
description = "braintrust test suite"
readme = "README.md"
authors = []
requires-python = ">=3.13, <3.14"
dependencies = [
    "autoevals>=0.0.130",
    "braintrust>=0.10.0",
    "click>=8.1.0",
    "faker>=40.1.2",
    "locust>=2.43.2",
    "pydantic-settings[yaml]>=2.6.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.11.0",
]

[project.scripts]
braintest = "braintest_suite:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["braintest_suite"]
